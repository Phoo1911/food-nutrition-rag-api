name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: pytest -q
      - name: Retrieval smoke test with the real embedding model
        run: PYTHONPATH=. python scripts/smoke_retrieval.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t food-nutrition-rag-api .
      - name: Container starts and answers /health
        run: |
          docker run -d --name api -p 8000:8000 food-nutrition-rag-api
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://localhost:8000/health
          docker exec -e HF_HUB_OFFLINE=1 api python -c "from rag_store import Embedder; print(Embedder().model_name)"
          docker logs api
